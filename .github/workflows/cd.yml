name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build API Lambda package
        run: |
          pip install requests -t api_package
          cp main/api_handler.py main/flight_aware_api.py api_package/
          cd api_package && zip -r ../api_function.zip .

      - name: Build export Lambda package
        run: |
          mkdir export_package
          cp main/export_handler.py main/athena_exporter.py export_package/
          cp main/pages.py main/page_base.py export_package/
          cd export_package && zip -r ../export_function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to ingestion Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_INGES_NAME }} \
            --zip-file fileb://api_function.zip
          aws lambda wait function-updated --function-name ${{ vars.LAMBDA_INGES_NAME }}

      - name: Deploy Glue script
        run: |
          script_location=$(aws glue get-job --job-name ${{ vars.GLUE_JOB_NAME }} \
            --query 'Job.Command.ScriptLocation' --output text)
          aws s3 cp main/transformations.py "$script_location"
          echo "Deployed transformations.py to $script_location for ${{ vars.GLUE_JOB_NAME }}"

      - name: Deploy Athena views
        run: |
          for file in main/sql/core/*.sql main/sql/web/*.sql; do
            echo "Running $file"
            query_id=$(aws athena start-query-execution \
              --work-group flight-aggregations \
              --query-string "$(cat "$file")" \
              --query QueryExecutionId --output text)
            while true; do
              state=$(aws athena get-query-execution --query-execution-id "$query_id" \
                --query QueryExecution.Status.State --output text)
              case "$state" in
                SUCCEEDED) echo "  succeeded"; break ;;
                FAILED|CANCELLED)
                  aws athena get-query-execution --query-execution-id "$query_id" \
                    --query QueryExecution.Status.StateChangeReason --output text
                  exit 1 ;;
                *) sleep 2 ;;
              esac
            done
          done

      - name: Deploy static website files
        run: |
          aws s3 cp website/style.css s3://${{ vars.WEB_BUCKET }}/website/style.css \
            --content-type "text/css" --cache-control "max-age=300"
          aws s3 cp website/counter.js s3://${{ vars.WEB_BUCKET }}/website/counter.js \
            --content-type "text/javascript" --cache-control "max-age=300"

      - name: Deploy to export Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_EXP_NAME }} \
            --zip-file fileb://export_function.zip
          aws lambda wait function-updated --function-name ${{ vars.LAMBDA_EXP_NAME }}