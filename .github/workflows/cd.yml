name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build Lambda package
        run: |
          pip install requests -t package
          cp main/handler.py main/flight_aware_api.py package/
          cd package && zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNC_NAME }} \
            --zip-file fileb://function.zip
          aws lambda wait function-updated --function-name ${{ vars.LAMBDA_FUNC_NAME }}

      - name: Deploy Glue script
        run: |
          script_location=$(aws glue get-job --job-name ${{ vars.GLUE_JOB_NAME }} \
            --query 'Job.Command.ScriptLocation' --output text)
          aws s3 cp main/transformations.py "$script_location"
          echo "Deployed transformations.py to $script_location for ${{ vars.GLUE_JOB_NAME }}"

      - name: Deploy Athena views
        run: |
          for file in sql/views/*.sql; do
            echo "Running $file"
            query_id=$(aws athena start-query-execution \
              --work-group flights-pipeline \
              --query-string "$(cat "$file")" \
              --query QueryExecutionId --output text)
            while true; do
              state=$(aws athena get-query-execution --query-execution-id "$query_id" \
                --query QueryExecution.Status.State --output text)
              case "$state" in
                SUCCEEDED) echo "  succeeded"; break ;;
                FAILED|CANCELLED)
                  aws athena get-query-execution --query-execution-id "$query_id" \
                    --query QueryExecution.Status.StateChangeReason --output text
                  exit 1 ;;
                *) sleep 2 ;;
              esac
            done
          done